<div class="w-1/2 p-6 overflow-y-auto flex flex-col justify-between">
    <div>
        <h2 class="text-2xl font-bold text-white mb-4 border-b border-gray-800 pb-2">{{.Dir}}</h2>
        <pre class="whitespace-pre-wrap font-sans text-gray-300 bg-gray-900 p-4 rounded border border-gray-800 text-sm leading-relaxed">{{.Readme}}</pre>
    </div>
    
<div class="mt-6 pt-4 border-t border-gray-800 space-y-2">
        <button class="bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 px-6 rounded shadow transition w-full"
                hx-post="/execute/{{.Dir}}"
                hx-target="#terminal-output"
                hx-indicator="#loading-spinner">
            ▶️ Run Program (go run)
        </button>

        <button class="bg-gray-700 hover:bg-gray-600 text-gray-200 font-medium py-1.5 px-6 rounded shadow transition w-full text-sm"
                hx-post="/run/{{.Dir}}"
                hx-target="#terminal-output"
                hx-indicator="#loading-spinner">
            🧪 Run Tests & Benchmarks (go test)
        </button>
    </div>
</div>

<div class="w-1/2 flex flex-col divide-y divide-gray-800">
    <div class="h-2/3 p-6 overflow-y-auto">
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">main.go</h3>
        <pre class="bg-gray-900 text-green-300 p-4 rounded text-xs font-mono overflow-x-auto border border-gray-800 shadow-inner"><code>{{.Code}}</code></pre>
    </div>

    <div class="h-1/3 p-6 bg-black flex flex-col overflow-hidden">
        <div class="flex items-center justify-between mb-2">
            <h3 class="text-xs font-semibold text-red-400 uppercase tracking-wider">Console Output</h3>
            <span id="loading-spinner" class="htmx-indicator text-xs text-yellow-500 animate-pulse">Executing code...</span>
        </div>
        <pre id="terminal-output" class="flex-1 bg-gray-950 border border-gray-900 text-gray-200 p-3 rounded font-mono text-xs overflow-y-auto shadow-inner">⚡ Waiting for execution execution...</pre>
    </div>
</div>
