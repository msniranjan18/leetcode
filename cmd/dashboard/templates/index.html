<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LeetCode Workspace</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">
    
    <header class="p-4 bg-gray-800 border-b border-gray-700 shadow-md">
        <h1 class="text-xl font-bold text-green-400">⚡ LeetCode Engine Dashboard</h1>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <aside class="w-1/4 bg-gray-800 border-r border-gray-700 p-4 overflow-y-auto">
            <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-4">Problems List</h2>
            <ul class="space-y-2">
                {{range .Questions}}
                <li>
                    <button class="w-full text-left p-2.5 rounded transition bg-gray-800 hover:bg-gray-700 text-gray-300 border border-transparent hover:border-gray-600"
                            hx-get="/problem/{{.}}" 
                            hx-target="#workspace-container" 
                            hx-swap="innerHTML">
                        📁 {{.}}
                    </button>
                </li>
                {{end}}
            </ul>
        </aside>

        <main id="workspace-container" class="w-3/4 flex divide-x divide-gray-700 bg-gray-950">
            <div class="flex-1 p-6 text-gray-500 flex items-center justify-center italic">
                Select a question from the sidebar to load the workspace.
            </div>
        </main>
    </div>
</body>
</html>
